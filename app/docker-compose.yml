services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      BASE_PATH: ${BASE_PATH:-/}
      APP_DATA_DIR: /app/data
    # Traefik reaches this service on the internal network. No host port in production.
    expose:
      - "3000"
    volumes:
      - type: volume
        source: product-grid-data
        target: /app/data

volumes:
  product-grid-data:
