name: Site check

# Runs on every PR, not only on site paths, so it can be a required check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter boxtown-site
      - run: pnpm --dir site exec playwright install --with-deps chromium
      - run: pnpm --dir site check
